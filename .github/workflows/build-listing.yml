name: Build Repo Listing

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Source repository that published the release
        required: false
        type: string
      release_tag:
        description: Release tag to ingest
        required: false
        type: string
  push:
    branches:
      - master
      - main
    paths:
      - source.json
      - scripts/**
      - registry/**
      - Website/index.html
      - Website/app.js
      - Website/styles.css
      - Website/banner.jpg
      - Website/favicon.ico

concurrency:
  group: unity-packages-listing-state
  cancel-in-progress: false

jobs:
  build-listing:
    name: Build listing
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.14

      - name: Ingest release and build listing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$SOURCE_REPOSITORY" || -n "$RELEASE_TAG" ]]; then
            bun scripts/build-listing.ts \
              --source-repository "$SOURCE_REPOSITORY" \
              --release-tag "$RELEASE_TAG"
          else
            bun scripts/build-listing.ts
          fi

      - name: Persist registry changes
        if: ${{ inputs.source_repository != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry Website/index.json
          if git diff --cached --quiet; then
            echo "Registry already contains this release."
            exit 0
          fi
          git commit -m "Update package listing for ${{ inputs.source_repository }}@${{ inputs.release_tag }}"
          git push origin HEAD:master

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: Website

  deploy:
    name: Deploy listing
    needs: build-listing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Set up Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
